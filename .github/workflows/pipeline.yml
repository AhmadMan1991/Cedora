name: Gold Pipeline

on:
  schedule:
    # EVERY 4 HOURS, weekdays, starting 07:00 Europe/Amsterdam — fires at local
    # 07:00, 11:00, 15:00, 19:00, 23:00. The "Amsterdam time gate" step below is
    # what enforces that; the cron just has to fire at every UTC hour that maps
    # to one of those local hours in EITHER season (DST-correct, GitHub cron is
    # UTC-only and does not follow DST):
    #   winter CET  (UTC+1): local 07/11/15/19/23 = UTC 06/10/14/18/22
    #   summer CEST (UTC+2): local 07/11/15/19/23 = UTC 05/09/13/17/21
    # Union of those UTC hours is the cron below; the gate lets exactly the 5
    # that land on a 4-hour slot through, so you get 5 runs/day in any season.
    #
    # Runs the full chain as ONE job so every step sees the previous step's
    # fresh output (COT -> Gold Bias -> Outlook -> Signals -> Performance).
    #
    # Offset to :08 instead of :00 — GitHub's own docs warn that scheduled
    # workflows queued at the top of the hour get delayed or silently dropped
    # under platform load.
    - cron: '8 5,6,9,10,13,14,17,18,21,22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fire only on a 4-hour slot from 07:00 Europe/Amsterdam (07/11/15/19/23
      # local), DST-correct. The cron fires at more UTC hours than needed; this
      # gate lets through only the local hours where (hour mod 4 == 3) and
      # hour >= 7 — i.e. 7, 11, 15, 19, 23. Manual runs always proceed.
      - name: Amsterdam 4-hour gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          h=$((10#$(TZ=Europe/Amsterdam date +%H)))
          echo "Amsterdam local hour: $h"
          if [ "$h" -ge 7 ] && [ $((h % 4)) -eq 3 ]; then
            echo "On a 4-hour slot (07/11/15/19/23) — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a 4-hour slot from 07:00 Amsterdam — skipping this fire."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run gold pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY:    ${{ secrets.TWELVEDATA_KEY }}
        run: python main.py

      - name: Commit dashboard + state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: pipeline run [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 10 + 5))
            done
          fi
